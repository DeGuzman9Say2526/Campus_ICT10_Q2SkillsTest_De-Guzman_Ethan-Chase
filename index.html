<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Periodic Table Information Finder</title>
</head>
<body>
    <main class="main-card">
        <h1>Discover Periodic Table Information</h1>

        <div class="element-form-box">
            <input id="element" name="element" type="text" placeholder="Enter an element (e.g. Hydrogen, Oxygen)" aria-label="Element name">

            <button id="info-button" type="button" class="btn info-button" py-click="show_info">Find Information</button>
        </div>

        <div id="result" class="result-box" aria-live="polite"></div>  
    <script type="py" src="main.py"></script>
</body>
</html>
